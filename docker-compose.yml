services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livedoc
      POSTGRES_PASSWORD: livedoc
      POSTGRES_DB: livedoc
    ports:
      - "5432:5432"
    volumes:
      - livedoc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livedoc -d livedoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  livedoc-postgres:
